<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" role="img">
  <title>A telescope parked pointing down with its lens cap on, facing away from a star</title>
  <rect x="4" y="4" width="112" height="82" rx="8" style="fill: var(--bg-sunk)"/>
  <circle cx="30" cy="22" r="2.4" style="fill: var(--amber)"/>
  <circle cx="98" cy="14" r="1.1" style="fill: var(--fg-subtle)"/>
  <circle cx="16" cy="40" r="1" style="fill: var(--fg-subtle)"/>
  <circle cx="102" cy="34" r="1.2" style="fill: var(--fg-subtle)"/>
  <!-- tripod -->
  <polygon points="58,54 46,80 50,80 60,58" style="fill: var(--fg-subtle)"/>
  <polygon points="62,54 74,80 70,80 60,58" style="fill: var(--fg-subtle)"/>
  <rect x="58.5" y="54" width="3" height="26" style="fill: var(--fg-subtle)" opacity=".55"/>
  <!-- tube hanging down, capped -->
  <g transform="rotate(22 60 50)">
    <rect x="36" y="44" width="46" height="12" rx="2" style="fill: var(--fg-muted)"/>
    <rect x="30" y="46" width="8" height="8" rx="1" style="fill: var(--fg-muted)" opacity=".55"/>
    <rect x="74" y="48" width="7" height="2.5" style="fill: var(--slate)"/>
    <rect x="80" y="37" width="7" height="26" rx="2" style="fill: var(--slate)"/>
    <rect x="86.5" y="47.5" width="3" height="5" style="fill: var(--slate)"/>
  </g>
</svg>
